<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wingman Tracker</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d0f14;
      --bg2: #13161f;
      --card: #191c27;
      --card2: #1f2335;
      --border: #272b3d;
      --border2: #323652;
      --text: #d4d8f0;
      --muted: #6b7094;
      --accent: #f0a030;
      --accent-dim: rgba(240,160,48,0.12);
      --win: #1D9E75;
      --win-bg: rgba(29,158,117,0.12);
      --loss: #E05A5A;
      --loss-bg: rgba(224,90,90,0.12);
      --tie: #c49a00;
      --tie-bg: rgba(196,154,0,0.12);
      --top: rgba(29,158,117,0.18);
      --radius: 10px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      font-size: 15px;
      min-height: 100vh;
    }

    /* ── Header ─────────────────────────────────────────────────────── */
    header {
      background: var(--bg2);
      border-bottom: 1px solid var(--border);
      padding: 14px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .logo {
      width: 32px; height: 32px;
      background: var(--accent);
      border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      font-size: 17px; font-weight: 900; color: #000; letter-spacing: -1px;
      flex-shrink: 0;
    }
    header h1 {
      font-size: 17px;
      font-weight: 700;
      color: #fff;
      letter-spacing: 0.3px;
    }
    header .sub {
      font-size: 12px;
      color: var(--muted);
      margin-top: 1px;
    }

    /* ── Tabs ────────────────────────────────────────────────────────── */
    nav {
      background: var(--bg2);
      border-bottom: 1px solid var(--border);
      display: flex;
      overflow-x: auto;
      scrollbar-width: none;
    }
    nav::-webkit-scrollbar { display: none; }
    nav button {
      flex: 1;
      min-width: 80px;
      padding: 12px 8px;
      background: none;
      border: none;
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: color .15s, border-color .15s;
      white-space: nowrap;
    }
    nav button.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
    }
    nav button:hover:not(.active) { color: var(--text); }

    /* ── Main ────────────────────────────────────────────────────────── */
    main { padding: 20px 16px; max-width: 680px; margin: 0 auto; }

    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    /* ── Cards ───────────────────────────────────────────────────────── */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px;
      margin-bottom: 14px;
    }
    .card-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--muted);
      margin-bottom: 14px;
    }

    /* ── Leaderboard controls ────────────────────────────────────────── */
    .lb-controls {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
      margin-bottom: 14px;
    }
    .lb-controls select {
      background: var(--card2);
      border: 1px solid var(--border2);
      color: var(--text);
      border-radius: 7px;
      padding: 7px 10px;
      font-size: 13px;
      cursor: pointer;
    }
    .toggle-label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--muted);
      cursor: pointer;
      user-select: none;
    }
    .toggle-label input[type=checkbox] {
      width: 16px; height: 16px; accent-color: var(--accent);
      cursor: pointer;
    }

    /* ── Leaderboard table ───────────────────────────────────────────── */
    .lb-wrap { overflow-x: auto; }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }
    thead th {
      text-align: left;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--muted);
      padding: 8px 10px;
      border-bottom: 1px solid var(--border);
    }
    thead th.num { text-align: center; }
    tbody tr {
      border-bottom: 1px solid var(--border);
      transition: background .1s;
    }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: var(--card2); }
    tbody tr.top-combo {
      background: var(--top);
      border-left: 3px solid var(--win);
    }
    tbody tr.unplayed { opacity: 0.35; }
    tbody td {
      padding: 10px 10px;
    }
    td.num { text-align: center; }
    .rank {
      font-size: 11px;
      color: var(--muted);
      font-weight: 600;
      min-width: 22px;
      display: inline-block;
    }
    .combo-name { font-weight: 600; color: #fff; }
    .combo-name .amp { color: var(--muted); font-weight: 400; }
    .stat-w { color: var(--win); font-weight: 700; }
    .stat-l { color: var(--loss); font-weight: 700; }
    .stat-t { color: var(--tie); font-weight: 600; }
    .diff {
      font-weight: 700;
      font-size: 13px;
    }
    .diff.pos { color: var(--win); }
    .diff.neg { color: var(--loss); }
    .diff.zero { color: var(--muted); }
    .crown { color: var(--accent); font-size: 13px; margin-left: 4px; }
    .no-data {
      text-align: center;
      color: var(--muted);
      padding: 30px;
      font-size: 14px;
    }

    /* ── Record form ─────────────────────────────────────────────────── */
    .vs-row {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 10px;
      align-items: center;
      margin-bottom: 14px;
    }
    .team-col { display: flex; flex-direction: column; gap: 8px; }
    .vs-badge {
      background: var(--card2);
      border: 1px solid var(--border2);
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 11px;
      font-weight: 800;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      text-align: center;
    }
    select.player-sel {
      width: 100%;
      background: var(--card2);
      border: 1px solid var(--border2);
      color: var(--text);
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 14px;
      cursor: pointer;
      transition: border-color .15s;
    }
    select.player-sel:focus {
      outline: none;
      border-color: var(--accent);
    }
    select.player-sel.err { border-color: var(--loss); }
    .result-row {
      display: flex;
      gap: 10px;
      margin-top: 4px;
    }
    .btn-win, .btn-tie {
      flex: 1;
      padding: 14px;
      border: none;
      border-radius: 9px;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      letter-spacing: 0.5px;
      transition: opacity .1s, transform .08s;
    }
    .btn-win:hover, .btn-tie:hover { opacity: .88; transform: translateY(-1px); }
    .btn-win:active, .btn-tie:active { transform: translateY(0); }
    .btn-win {
      background: var(--win);
      color: #fff;
    }
    .btn-tie {
      background: var(--card2);
      color: var(--tie);
      border: 2px solid var(--tie);
    }
    .err-msg {
      color: var(--loss);
      font-size: 13px;
      margin-top: 8px;
      min-height: 18px;
    }
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: var(--win);
      color: #fff;
      padding: 10px 22px;
      border-radius: 30px;
      font-weight: 700;
      font-size: 14px;
      z-index: 100;
      transition: transform .25s cubic-bezier(.34,1.5,.64,1);
      white-space: nowrap;
    }
    .toast.show { transform: translateX(-50%) translateY(0); }

    /* ── Match log ───────────────────────────────────────────────────── */
    .log-entry {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 11px 14px;
      border-bottom: 1px solid var(--border);
      font-size: 13px;
    }
    .log-entry:last-child { border-bottom: none; }
    .log-num {
      color: var(--muted);
      font-size: 11px;
      font-weight: 600;
      width: 28px;
      flex-shrink: 0;
    }
    .log-teams {
      flex: 1;
      color: var(--text);
    }
    .log-teams .winner { color: #fff; font-weight: 600; }
    .log-teams .loser { color: var(--muted); }
    .log-teams .sep { color: var(--muted); margin: 0 4px; }
    .log-badge {
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 4px;
      letter-spacing: 0.5px;
      flex-shrink: 0;
    }
    .log-badge.win { background: var(--win-bg); color: var(--win); }
    .log-badge.tie { background: var(--tie-bg); color: var(--tie); }
    .log-del {
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      font-size: 15px;
      padding: 4px 6px;
      border-radius: 4px;
      flex-shrink: 0;
      transition: color .1s, background .1s;
    }
    .log-del:hover { color: var(--loss); background: var(--loss-bg); }
    .log-search {
      width: 100%;
      background: var(--card2);
      border: 1px solid var(--border2);
      color: var(--text);
      border-radius: 8px;
      padding: 9px 12px;
      font-size: 14px;
      margin-bottom: 14px;
    }
    .log-search:focus { outline: none; border-color: var(--accent); }

    /* ── Data tab ────────────────────────────────────────────────────── */
    textarea.csv-area {
      width: 100%;
      background: var(--card2);
      border: 1px solid var(--border2);
      color: var(--text);
      border-radius: 8px;
      padding: 12px;
      font-family: 'Courier New', monospace;
      font-size: 12px;
      resize: vertical;
      min-height: 160px;
      line-height: 1.5;
    }
    textarea.csv-area:focus { outline: none; border-color: var(--accent); }
    .btn-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px; }
    .btn {
      padding: 10px 18px;
      border-radius: 8px;
      border: none;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: opacity .1s;
    }
    .btn:hover { opacity: .85; }
    .btn-primary { background: var(--accent); color: #000; }
    .btn-secondary {
      background: var(--card2);
      color: var(--text);
      border: 1px solid var(--border2);
    }
    .btn-danger {
      background: var(--loss-bg);
      color: var(--loss);
      border: 1px solid var(--loss);
    }
    .import-note {
      font-size: 12px;
      color: var(--muted);
      margin-top: 8px;
    }

    /* ── Stats bar ───────────────────────────────────────────────────── */
    .stats-bar {
      display: flex;
      gap: 16px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }
    .stat-pill {
      background: var(--card2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 12px;
      color: var(--muted);
    }
    .stat-pill strong { color: var(--text); font-size: 15px; display: block; margin-bottom: 2px; }

    /* ── Players tab ─────────────────────────────────────────────────── */
    .player-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
      transition: background .1s;
    }
    .player-row:last-child { border-bottom: none; }
    .player-row:hover { background: var(--card2); }
    .player-row.top-player {
      background: var(--top);
      border-left: 3px solid var(--win);
    }
    .player-rank {
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
      width: 24px;
      flex-shrink: 0;
      text-align: center;
    }
    .player-rank.gold   { color: #f0c040; }
    .player-rank.silver { color: #aab0c4; }
    .player-rank.bronze { color: #cd7f50; }
    .player-info { flex: 1; min-width: 0; }
    .player-name {
      font-weight: 700;
      font-size: 15px;
      color: #fff;
    }
    .player-meta {
      font-size: 11px;
      color: var(--muted);
      margin-top: 2px;
    }
    .player-meta .partner { color: var(--accent); }
    .player-wl {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-shrink: 0;
    }
    .wl-group { text-align: center; }
    .wl-group .val {
      font-size: 14px;
      font-weight: 700;
      display: block;
    }
    .wl-group .lbl {
      font-size: 10px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .player-winpct {
      flex-shrink: 0;
      width: 60px;
      text-align: right;
    }
    .winpct-val {
      font-size: 15px;
      font-weight: 800;
    }
    .winpct-bar-wrap {
      width: 100%;
      height: 4px;
      background: var(--border2);
      border-radius: 2px;
      margin-top: 4px;
      overflow: hidden;
    }
    .winpct-bar {
      height: 100%;
      border-radius: 2px;
      background: var(--win);
      transition: width .4s ease;
    }
    .player-row.no-games { opacity: 0.35; }
    .sort-row {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-bottom: 14px;
      font-size: 12px;
      color: var(--muted);
    }
    .sort-row select {
      background: var(--card2);
      border: 1px solid var(--border2);
      color: var(--text);
      border-radius: 7px;
      padding: 6px 10px;
      font-size: 12px;
      cursor: pointer;
    }

    @media (max-width: 480px) {
      main { padding: 14px 10px; }
      .vs-row { grid-template-columns: 1fr; }
      .vs-badge { display: none; }
      .btn-win, .btn-tie { padding: 13px; font-size: 14px; }
      .player-meta { display: none; }
    }
  </style>
</head>
<body>

<header>
  <div class="logo">2v2</div>
  <div>
    <h1>Wingman Tracker</h1>
    <div class="sub">CS2 · 7 players</div>
  </div>
</header>

<nav id="nav">
  <button class="active" onclick="switchTab('lb')">Combos</button>
  <button onclick="switchTab('players')">Players</button>
  <button onclick="switchTab('record')">Record</button>
  <button onclick="switchTab('log')">Match Log</button>
  <button onclick="switchTab('data')">Data</button>
</nav>

<main>
  <!-- ── Leaderboard ───────────────────────────────────────────────── -->
  <div id="tab-lb" class="tab-panel active">
    <div class="stats-bar" id="stats-bar"></div>
    <div class="card" style="padding:14px 14px 4px">
      <div class="lb-controls">
        <select id="filter-player" onchange="renderLB()">
          <option value="">All players</option>
        </select>
        <label class="toggle-label">
          <input type="checkbox" id="hide-unplayed" onchange="renderLB()" checked />
          Hide unplayed
        </label>
      </div>
      <div class="lb-wrap">
        <table>
          <thead>
            <tr>
              <th>#</th>
              <th>Combo</th>
              <th class="num">W</th>
              <th class="num">L</th>
              <th class="num">T</th>
              <th class="num">+/-</th>
            </tr>
          </thead>
          <tbody id="lb-body"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- ── Players ──────────────────────────────────────────────────── -->
  <div id="tab-players" class="tab-panel">
    <div class="sort-row">
      Sort by:
      <select id="player-sort" onchange="renderPlayers()">
        <option value="winpct">Win rate</option>
        <option value="diff">+/- differential</option>
        <option value="wins">Total wins</option>
        <option value="gp">Games played</option>
      </select>
    </div>
    <div class="card" style="padding:0; overflow:hidden">
      <div id="players-body"></div>
    </div>
  </div>

  <!-- ── Record ────────────────────────────────────────────────────── -->
  <div id="tab-record" class="tab-panel">
    <div class="card">
      <div class="card-title">Record a result</div>
      <div class="vs-row">
        <div class="team-col">
          <select class="player-sel" id="t1p1"><option value="">Player 1</option></select>
          <select class="player-sel" id="t1p2"><option value="">Player 2</option></select>
        </div>
        <div class="vs-badge">beat</div>
        <div class="team-col">
          <select class="player-sel" id="t2p1"><option value="">Player 3</option></select>
          <select class="player-sel" id="t2p2"><option value="">Player 4</option></select>
        </div>
      </div>
      <div class="result-row">
        <button class="btn-win" onclick="recordResult('win')">WIN</button>
        <button class="btn-tie" onclick="recordResult('tie')">TIE</button>
      </div>
      <div class="err-msg" id="rec-err"></div>
    </div>
  </div>

  <!-- ── Log ───────────────────────────────────────────────────────── -->
  <div id="tab-log" class="tab-panel">
    <input class="log-search" id="log-search" placeholder="Search players…" oninput="renderLog()" />
    <div class="card" style="padding:0; overflow:hidden">
      <div id="log-body"></div>
    </div>
  </div>

  <!-- ── Data ──────────────────────────────────────────────────────── -->
  <div id="tab-data" class="tab-panel">
    <div class="card">
      <div class="card-title">Export CSV</div>
      <textarea class="csv-area" id="csv-export" readonly></textarea>
      <div class="btn-row">
        <button class="btn btn-primary" onclick="downloadCSV()">Download .csv</button>
        <button class="btn btn-secondary" onclick="copyCSV()">Copy to clipboard</button>
      </div>
    </div>
    <div class="card">
      <div class="card-title">Import CSV</div>
      <textarea class="csv-area" id="csv-import" placeholder="Paste CSV here…"></textarea>
      <p class="import-note">⚠ Importing replaces all current match data.</p>
      <div class="btn-row">
        <button class="btn btn-primary" onclick="importCSV()">Import & Replace</button>
        <button class="btn btn-danger" onclick="clearAll()">Clear all data</button>
      </div>
    </div>
  </div>
</main>

<div class="toast" id="toast"></div>

<script>
// ── Constants ──────────────────────────────────────────────────────────────
const PLAYERS = ['Curtis', 'George', 'Jack', 'Jake', 'Reber', 'Tom', 'Tommy'];
const LS_KEY = 'wingman_log_v1';

const SEED = [
  {game:1,  t1p1:'Tommy', t1p2:'Curtis', t2p1:'Jake', t2p2:'Jack',   result:'win'},
  {game:2,  t1p1:'Tommy', t1p2:'Curtis', t2p1:'Jake', t2p2:'Jack',   result:'win'},
  {game:3,  t1p1:'Tommy', t1p2:'Jack',   t2p1:'Curtis',t2p2:'Jake',  result:'win'},
  {game:4,  t1p1:'Tommy', t1p2:'Jack',   t2p1:'Curtis',t2p2:'Jake',  result:'win'},
  {game:5,  t1p1:'Tommy', t1p2:'Jake',   t2p1:'Jack',  t2p2:'Curtis',result:'win'},
  {game:6,  t1p1:'Tommy', t1p2:'Jake',   t2p1:'Jack',  t2p2:'Curtis',result:'win'},
  {game:7,  t1p1:'Jake',  t1p2:'Jack',   t2p1:'Tommy', t2p2:'Curtis',result:'win'},
  {game:8,  t1p1:'Tommy', t1p2:'Curtis', t2p1:'Jake',  t2p2:'Jack',  result:'win'},
  {game:9,  t1p1:'Tommy', t1p2:'Jack',   t2p1:'Curtis',t2p2:'Jake',  result:'tie'},
  {game:10, t1p1:'Tommy', t1p2:'Jack',   t2p1:'Curtis',t2p2:'Jake',  result:'win'},
  {game:11, t1p1:'Tommy', t1p2:'Jake',   t2p1:'Jack',  t2p2:'Curtis',result:'win'},
  {game:12, t1p1:'Tommy', t1p2:'Jake',   t2p1:'Jack',  t2p2:'Curtis',result:'tie'},
  {game:13, t1p1:'Tommy', t1p2:'Curtis', t2p1:'Jake',  t2p2:'Jack',  result:'win'},
  {game:14, t1p1:'Tommy', t1p2:'Curtis', t2p1:'Jake',  t2p2:'Jack',  result:'win'},
];

// ── State ──────────────────────────────────────────────────────────────────
let log = [];

function load() {
  const raw = localStorage.getItem(LS_KEY);
  if (raw) {
    try { log = JSON.parse(raw); return; } catch(e) {}
  }
  log = SEED.map(e => ({...e}));
  save();
}

function save() {
  localStorage.setItem(LS_KEY, JSON.stringify(log));
}

// ── Logic ──────────────────────────────────────────────────────────────────
function comboKey(a, b) { return [a, b].sort().join(' & '); }

function computeStats() {
  const stats = {};
  for (let i = 0; i < PLAYERS.length; i++)
    for (let j = i+1; j < PLAYERS.length; j++)
      stats[comboKey(PLAYERS[i], PLAYERS[j])] = {w:0,l:0,t:0};
  log.forEach(e => {
    const wk = comboKey(e.t1p1, e.t1p2);
    const lk = comboKey(e.t2p1, e.t2p2);
    if (!stats[wk]) stats[wk] = {w:0,l:0,t:0};
    if (!stats[lk]) stats[lk] = {w:0,l:0,t:0};
    if (e.result === 'win') { stats[wk].w++; stats[lk].l++; }
    else { stats[wk].t++; stats[lk].t++; }
  });
  return stats;
}

// ── Tabs ───────────────────────────────────────────────────────────────────
function switchTab(id) {
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
  document.getElementById('tab-' + id).classList.add('active');
  const btns = document.querySelectorAll('nav button');
  const order = ['lb','players','record','log','data'];
  btns[order.indexOf(id)].classList.add('active');
  if (id === 'lb') renderLB();
  if (id === 'players') renderPlayers();
  if (id === 'log') renderLog();
  if (id === 'data') renderData();
}

// ── Leaderboard ────────────────────────────────────────────────────────────
function renderLB() {
  const stats = computeStats();
  const filterP = document.getElementById('filter-player').value;
  const hideUnplayed = document.getElementById('hide-unplayed').checked;

  let rows = Object.entries(stats).map(([key, s]) => {
    const diff = s.w - s.l;
    const played = s.w + s.l + s.t;
    return {key, ...s, diff, played};
  });

  if (filterP) rows = rows.filter(r => r.key.includes(filterP));
  if (hideUnplayed) rows = rows.filter(r => r.played > 0);

  rows.sort((a, b) => {
    if (b.diff !== a.diff) return b.diff - a.diff;
    if (b.w !== a.w) return b.w - a.w;
    return a.key.localeCompare(b.key);
  });

  const playedRows = rows.filter(r => r.played > 0);
  const topKey = playedRows.length ? playedRows[0].key : null;

  // Stats bar
  const totalGames = log.length;
  const wins = log.filter(e => e.result === 'win').length;
  const ties = log.filter(e => e.result === 'tie').length;
  document.getElementById('stats-bar').innerHTML = `
    <div class="stat-pill"><strong>${totalGames}</strong>Games played</div>
    <div class="stat-pill"><strong>${wins}</strong>Decisive</div>
    <div class="stat-pill"><strong>${ties}</strong>Ties</div>
  `;

  const tbody = document.getElementById('lb-body');
  if (!rows.length) {
    tbody.innerHTML = '<tr><td colspan="6" class="no-data">No combos found</td></tr>';
    return;
  }

  let rank = 0, lastDiff = null, shownRank = 0;
  tbody.innerHTML = rows.map(r => {
    shownRank++;
    if (r.played > 0 && r.diff !== lastDiff) { rank = shownRank; lastDiff = r.diff; }
    const isTop = r.key === topKey && r.played > 0;
    const unplayed = r.played === 0;
    const [p1, p2] = r.key.split(' & ');
    const diffClass = r.diff > 0 ? 'pos' : r.diff < 0 ? 'neg' : 'zero';
    const diffStr = r.diff > 0 ? '+' + r.diff : r.diff;
    return `
      <tr class="${isTop ? 'top-combo' : ''} ${unplayed ? 'unplayed' : ''}">
        <td><span class="rank">${r.played > 0 ? rank : '—'}</span></td>
        <td>
          <span class="combo-name">${p1} <span class="amp">&amp;</span> ${p2}</span>
          ${isTop ? '<span class="crown">★</span>' : ''}
        </td>
        <td class="num"><span class="stat-w">${r.w}</span></td>
        <td class="num"><span class="stat-l">${r.l}</span></td>
        <td class="num"><span class="stat-t">${r.t}</span></td>
        <td class="num"><span class="diff ${diffClass}">${r.played ? diffStr : '—'}</span></td>
      </tr>`;
  }).join('');
}

// ── Players ────────────────────────────────────────────────────────────────
function computePlayerStats() {
  const stats = {};
  PLAYERS.forEach(p => { stats[p] = {w:0, l:0, t:0, partners:{}}; });

  log.forEach(e => {
    const winners = [e.t1p1, e.t1p2];
    const losers  = [e.t2p1, e.t2p2];
    const isWin = e.result === 'win';

    winners.forEach(p => {
      if (!stats[p]) stats[p] = {w:0,l:0,t:0,partners:{}};
      if (isWin) stats[p].w++; else stats[p].t++;
      const partner = winners.find(x => x !== p);
      stats[p].partners[partner] = (stats[p].partners[partner] || 0) + (isWin ? 1 : 0);
    });
    losers.forEach(p => {
      if (!stats[p]) stats[p] = {w:0,l:0,t:0,partners:{}};
      if (isWin) stats[p].l++; else stats[p].t++;
      const partner = losers.find(x => x !== p);
      if (!stats[p].partners[partner]) stats[p].partners[partner] = 0;
    });
  });
  return stats;
}

function renderPlayers() {
  const stats = computePlayerStats();
  const sortBy = document.getElementById('player-sort').value;

  let rows = PLAYERS.map(p => {
    const s = stats[p];
    const gp = s.w + s.l + s.t;
    const decisive = s.w + s.l;
    const winpct = decisive > 0 ? s.w / decisive : -1;
    const diff = s.w - s.l;
    const bestPartner = Object.entries(s.partners)
      .filter(([,wins]) => wins > 0)
      .sort((a,b) => b[1]-a[1])[0];
    return {name:p, ...s, gp, decisive, winpct, diff, bestPartner};
  });

  rows.sort((a, b) => {
    const aPlayed = a.gp > 0, bPlayed = b.gp > 0;
    if (aPlayed !== bPlayed) return aPlayed ? -1 : 1;
    if (!aPlayed) return a.name.localeCompare(b.name);
    if (sortBy === 'winpct') {
      if (b.winpct !== a.winpct) return b.winpct - a.winpct;
      return b.w - a.w;
    }
    if (sortBy === 'diff') {
      if (b.diff !== a.diff) return b.diff - a.diff;
      return b.winpct - a.winpct;
    }
    if (sortBy === 'wins') return b.w - a.w;
    if (sortBy === 'gp')   return b.gp - a.gp;
    return 0;
  });

  const body = document.getElementById('players-body');
  let rank = 0;
  body.innerHTML = rows.map((r, i) => {
    const noGames = r.gp === 0;
    if (!noGames) rank++;
    const isTop = rank === 1 && !noGames;
    const rankClass = rank === 1 ? 'gold' : rank === 2 ? 'silver' : rank === 3 ? 'bronze' : '';
    const rankLabel = noGames ? '—' : rank;
    const pct = r.decisive > 0 ? Math.round(r.winpct * 100) : null;
    const pctColor = pct === null ? 'var(--muted)' : pct >= 60 ? 'var(--win)' : pct >= 40 ? 'var(--text)' : 'var(--loss)';
    const partnerText = r.bestPartner
      ? `Best partner: <span class="partner">${r.bestPartner[0]}</span> (${r.bestPartner[1]}W)`
      : 'No wins yet';
    return `
      <div class="player-row ${isTop ? 'top-player' : ''} ${noGames ? 'no-games' : ''}">
        <div class="player-rank ${rankClass}">${rankLabel}</div>
        <div class="player-info">
          <div class="player-name">${r.name}</div>
          <div class="player-meta">${noGames ? 'No games played' : partnerText}</div>
        </div>
        <div class="player-wl">
          <div class="wl-group"><span class="val stat-w">${r.w}</span><span class="lbl">W</span></div>
          <div class="wl-group"><span class="val stat-l">${r.l}</span><span class="lbl">L</span></div>
          <div class="wl-group"><span class="val stat-t">${r.t}</span><span class="lbl">T</span></div>
        </div>
        <div class="player-winpct">
          <span class="winpct-val" style="color:${pctColor}">${pct !== null ? pct + '%' : '—'}</span>
          <div class="winpct-bar-wrap">
            <div class="winpct-bar" style="width:${pct ?? 0}%; background:${pctColor}"></div>
          </div>
        </div>
      </div>`;
  }).join('');
}

// ── Record ─────────────────────────────────────────────────────────────────
function populateSelects() {
  ['t1p1','t1p2','t2p1','t2p2'].forEach((id, i) => {
    const sel = document.getElementById(id);
    const labels = ['Player 1','Player 2','Player 3','Player 4'];
    sel.innerHTML = `<option value="">${labels[i]}</option>` +
      PLAYERS.map(p => `<option value="${p}">${p}</option>`).join('');
  });
  const fp = document.getElementById('filter-player');
  fp.innerHTML = '<option value="">All players</option>' +
    PLAYERS.map(p => `<option value="${p}">${p}</option>`).join('');
}

function recordResult(result) {
  const ids = ['t1p1','t1p2','t2p1','t2p2'];
  const vals = ids.map(id => document.getElementById(id).value);
  const errEl = document.getElementById('rec-err');
  ids.forEach(id => document.getElementById(id).classList.remove('err'));

  if (vals.some(v => !v)) {
    const missing = ids.filter(id => !document.getElementById(id).value);
    missing.forEach(id => document.getElementById(id).classList.add('err'));
    errEl.textContent = 'Select all 4 players.';
    return;
  }
  const unique = new Set(vals);
  if (unique.size < 4) {
    errEl.textContent = 'All 4 players must be different.';
    const seen = new Set();
    ids.forEach(id => {
      const v = document.getElementById(id).value;
      if (seen.has(v)) document.getElementById(id).classList.add('err');
      seen.add(v);
    });
    return;
  }
  errEl.textContent = '';

  const nextGame = log.length ? Math.max(...log.map(e => e.game)) + 1 : 1;
  log.push({game: nextGame, t1p1: vals[0], t1p2: vals[1], t2p1: vals[2], t2p2: vals[3], result});
  save();

  const msg = result === 'win'
    ? `${vals[0]} & ${vals[1]} beat ${vals[2]} & ${vals[3]}!`
    : `Tie: ${vals[0]} & ${vals[1]} vs ${vals[2]} & ${vals[3]}`;
  showToast(msg);

  ids.forEach(id => { document.getElementById(id).value = ''; });
}

// ── Log ────────────────────────────────────────────────────────────────────
function renderLog() {
  const q = (document.getElementById('log-search').value || '').toLowerCase();
  let entries = [...log].reverse();
  if (q) entries = entries.filter(e =>
    [e.t1p1,e.t1p2,e.t2p1,e.t2p2].some(p => p.toLowerCase().includes(q))
  );

  const body = document.getElementById('log-body');
  if (!entries.length) {
    body.innerHTML = '<div class="no-data">No matches yet.</div>';
    return;
  }
  body.innerHTML = entries.map(e => {
    const isTie = e.result === 'tie';
    return `
      <div class="log-entry">
        <span class="log-num">#${e.game}</span>
        <span class="log-teams">
          <span class="${isTie ? '' : 'winner'}">${e.t1p1} &amp; ${e.t1p2}</span>
          <span class="sep">${isTie ? '=' : '▶'}</span>
          <span class="${isTie ? '' : 'loser'}">${e.t2p1} &amp; ${e.t2p2}</span>
        </span>
        <span class="log-badge ${e.result}">${e.result.toUpperCase()}</span>
        <button class="log-del" onclick="deleteGame(${e.game})" title="Delete">✕</button>
      </div>`;
  }).join('');
}

function deleteGame(gameNum) {
  if (!confirm(`Delete game #${gameNum}?`)) return;
  log = log.filter(e => e.game !== gameNum);
  save();
  renderLog();
}

// ── Data ───────────────────────────────────────────────────────────────────
function toCSV() {
  const header = 'game,team1p1,team1p2,team2p1,team2p2,result';
  const rows = log.map(e =>
    `${e.game},"${e.t1p1}","${e.t1p2}","${e.t2p1}","${e.t2p2}",${e.result}`
  );
  return [header, ...rows].join('\n');
}

function renderData() {
  document.getElementById('csv-export').value = toCSV();
}

function downloadCSV() {
  const blob = new Blob([toCSV()], {type: 'text/csv'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'wingman_log.csv'; a.click();
  URL.revokeObjectURL(url);
}

function copyCSV() {
  navigator.clipboard.writeText(toCSV()).then(() => showToast('Copied to clipboard!'));
}

function importCSV() {
  const raw = document.getElementById('csv-import').value.trim();
  if (!raw) return;
  const lines = raw.split('\n').map(l => l.trim()).filter(Boolean);
  if (lines.length < 2) { alert('CSV looks empty.'); return; }
  const header = lines[0].toLowerCase();
  if (!header.includes('team1p1')) { alert('Invalid CSV format.'); return; }

  const parsed = [];
  for (let i = 1; i < lines.length; i++) {
    const parts = lines[i].match(/(".*?"|[^,]+)(?=\s*,|\s*$)/g);
    if (!parts || parts.length < 6) continue;
    const clean = parts.map(p => p.replace(/^"|"$/g,'').trim());
    parsed.push({
      game: parseInt(clean[0]),
      t1p1: clean[1], t1p2: clean[2],
      t2p1: clean[3], t2p2: clean[4],
      result: clean[5]
    });
  }
  if (!parsed.length) { alert('No valid rows found.'); return; }
  if (!confirm(`Replace all data with ${parsed.length} imported games?`)) return;
  log = parsed;
  save();
  document.getElementById('csv-import').value = '';
  showToast(`Imported ${parsed.length} games!`);
  renderData();
}

function clearAll() {
  if (!confirm('Clear ALL match data? This cannot be undone.')) return;
  log = [];
  save();
  showToast('Data cleared.');
  renderData();
}

// ── Toast ──────────────────────────────────────────────────────────────────
let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2800);
}

// ── Init ───────────────────────────────────────────────────────────────────
load();
populateSelects();
renderLB();
</script>
